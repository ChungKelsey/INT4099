<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR.js – Multi-marker demo</title>

    <!-- call A-Frame + AR.js api-->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <!-- Layout of the website-->
    <style>
      body,html{margin:0;overflow:hidden}
      .hint{
        position:fixed;top:0;left:0;right:0;
        background:rgba(0,0,0,.6);color:#fff;
        text-align:center;padding:8px;font-family:sans-serif;z-index:10
      }
    </style>

    <!-- Helper to reduce “too metallic = looks black” and make faces double-sided -->
    <script>
      AFRAME.registerComponent('material-fixes', {
        init () {
          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;
            mesh.traverse(o => {
              if (o.isMesh && o.material) {
                if ('metalness' in o.material) o.material.metalness = 0.0;
                if ('roughness' in o.material) o.material.roughness = 1.0;
                o.material.side = THREE.DoubleSide;
                o.material.needsUpdate = true;
              }
            });
          });
        }
      });
    </script>

    <button id="audioUnlock" style="
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 8px 14px; border-radius: 4px; border: none;
    ">
      Tap to enable sound
    </button>

    <script>
      // Unlock/resume WebAudio on a user gesture so sound.playSound() will work later.
      document.getElementById('audioUnlock').addEventListener('click', function () {
        const sceneEl = document.querySelector('a-scene');

        // If A-Frame created an audio listener, resume its context
        if (sceneEl && sceneEl.audioListener && sceneEl.audioListener.context) {
          const ctx = sceneEl.audioListener.context;
          if (ctx.state === 'suspended') {
            ctx.resume().catch(()=>{});
          }
        }

        // Also create/resume a generic AudioContext to ensure the browser's "user gesture" is satisfied.
        try {
          if (!window.__unlockedAudioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            window.__unlockedAudioCtx = new Ctx();
          }
          if (window.__unlockedAudioCtx.state === 'suspended') {
            window.__unlockedAudioCtx.resume().catch(()=>{});
          }
        } catch (e) {
          // ignore if not available
        }

        this.style.display = 'none';
      });
    </script>

  </head>

  <script>
  // When a marker becomes visible, play its local sound; when lost, stop it.
  document.addEventListener('DOMContentLoaded', function () {
    const markers = document.querySelectorAll('a-marker[id]');
    markers.forEach(marker => {
      const soundEl = marker.querySelector('[sound]');
      if (!soundEl) return;

      marker.addEventListener('markerFound', () => {
        if (soundEl.components && soundEl.components.sound) {
          soundEl.components.sound.playSound();
        }
      });

      marker.addEventListener('markerLost', () => {
        if (soundEl.components && soundEl.components.sound) {
          soundEl.components.sound.stopSound();
        }
      });
    });
  });
  </script>


  <!-- Ask for camera permission -->
  <body>
    <div class="hint">Allow camera access and show any of your pattern markers</div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      renderer="physicallyCorrectLights: true; toneMapping: ACESFilmicToneMapping; antialias: true; logarithmicDepthBuffer: true;"
      arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false;"
    >
      <a-assets>
        <a-asset-item id="model1" src="assets/pattern-1.glb"></a-asset-item>
        <a-asset-item id="model2" src="assets/pattern-2.glb"></a-asset-item>
        <a-asset-item id="model3" src="assets/pattern-3.glb"></a-asset-item>
        <a-asset-item id="model4" src="assets/pattern-4.glb"></a-asset-item>
        <!-- preload audio; A-Frame sound components will use these -->
        <audio id="audio1" src="assets/audio1.mp3"></audio>
        <audio id="audio2" src="assets/audio2.mp3"></audio>
        <audio id="audio3" src="assets/audio3.mp3"></audio>
        <audio id="audio4" src="assets/audio4.mp3"></audio>
      </a-assets>

      <!-- Global lights (affect all markers/models) -->
      <a-entity light="type: ambient; intensity: 1.0"></a-entity>
      <a-entity light="type: hemisphere; intensity: 1.0; groundColor: #444"></a-entity>
      <a-entity light="type: directional; intensity: 1.2" position="1 2 0"></a-entity>

      <!-- Marker 1 -->
      <a-marker id="marker1" type="pattern" url="assets/pattern-1.patt">
        <a-entity gltf-model="#model1" material-fixes position="0 0.01 0" rotation="90 270 90" scale="1 1 1"></a-entity>

        <!-- sound inside marker, autoplay disabled; will be played via markerFound -->
        <a-entity
          id="sound1"
          sound="src: #audio1; autoplay: false; loop: false; positional: false">
        </a-entity>
      </a-marker>

      <!-- Marker 2 -->
      <a-marker id="marker2" type="pattern" url="assets/pattern-2.patt">
        <a-entity gltf-model="#model2" material-fixes position="0 0.01 0" rotation="270 180 180" scale="0.2 0.2 0.2"></a-entity>

        <a-entity
          id="sound2"
          sound="src: #audio2; autoplay: false; loop: false; positional: false">
        </a-entity>
      </a-marker>

      <!-- Marker 3 -->
      <a-marker id="marker3" type="pattern" url="assets/pattern-3.patt">
        <a-entity gltf-model="#model3" material-fixes position="0 0.01 0" rotation="270 180 180" scale="0.01 0.01 0.01"></a-entity>

        <a-entity
          id="sound3"
          sound="src: #audio3; autoplay: false; loop: false; positional: false">
        </a-entity>
      </a-marker>

      <!-- Marker 4 -->
      <a-marker id="marker4" type="pattern" url="assets/pattern-4.patt">
        <a-entity gltf-model="#model4" material-fixes position="0 0.01 0" rotation="270 -90 90" scale="0.2 0.2 0.2"></a-entity>

        <a-entity
          id="sound4"
          sound="src: #audio4; autoplay: false; loop: false; positional: false">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>

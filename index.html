<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR.js – Multi-marker demo</title>

    <!-- call A-Frame + AR.js api-->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <!-- Layout of the website-->
    <style>
      body,html{margin:0;overflow:hidden}
      .hint{
        position:fixed;top:0;left:0;right:0;
        background:rgba(0,0,0,.6);color:#fff;
        text-align:center;padding:8px;font-family:sans-serif;z-index:10
      }
    </style>

    <!-- Helper to reduce “too metallic = looks black” and make faces double-sided -->
    <script>
      AFRAME.registerComponent('material-fixes', {
        init () {
          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;
            mesh.traverse(o => {
              if (o.isMesh && o.material) {
                if ('metalness' in o.material) o.material.metalness = 0.0;
                if ('roughness' in o.material) o.material.roughness = 1.0;
                o.material.side = THREE.DoubleSide;
                o.material.needsUpdate = true;
              }
            });
          });
        }
      });
    </script>
        <button id="audioUnlock" style="
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 8px 14px; border-radius: 4px; border: none;
    ">
      Tap to enable sound
    </button>

    <script>
      document.getElementById('audioUnlock').addEventListener('click', function () {
        // This user gesture "unlocks" audio for the page
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl && sceneEl.audioListener && sceneEl.audioListener.context) {
          const ctx = sceneEl.audioListener.context;
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
        }
        this.style.display = 'none';
      });
    </script>

  </head>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    // Marker 1
    const marker1 = document.querySelector('#marker1');
    const sound1  = document.querySelector('#sound1');

    if (marker1 && sound1) {
      marker1.addEventListener('markerFound', () => {
        // Play the sound when the marker is visible
        if (sound1.components.sound) {
          sound1.components.sound.playSound();
        }
      });

      marker1.addEventListener('markerLost', () => {
        // Stop the sound when the marker disappears
        if (sound1.components.sound) {
          sound1.components.sound.stopSound();
        }
      });
    }

    // Repeat this pattern for marker2
    
    const marker2 = document.querySelector('#marker2');
    const sound2  = document.querySelector('#sound2');

    if (marker2 && sound2) {
      marker2.addEventListener('markerFound', () => {
        if (sound2.components.sound) {
          sound2.components.sound.playSound();
        }
      });

      marker2.addEventListener('markerLost', () => {
        if (sound2.components.sound) {
          sound2.components.sound.stopSound();
        }
      });
    }
    // Repeat this pattern for marker3 and marker4
    const marker3 = document.querySelector('#marker3');
    const sound3  = document.querySelector('#sound3');
    if (marker3 && sound3) {
      marker3.addEventListener('markerFound', () => {
        if (sound3.components.sound) {
          sound3.components.sound.playSound();
        }
      });

      marker3.addEventListener('markerLost', () => {
        if (sound3.components.sound) {
          sound3.components.sound.stopSound();
        }
      });
    }
    const marker4 = document.querySelector('#marker4');
    const sound4  = document.querySelector('#sound4');
    if (marker4 && sound4) {
      marker4.addEventListener('markerFound', () => {
        if (sound4.components.sound) {
          sound4.components.sound.playSound();
        }
      });

      marker4.addEventListener('markerLost', () => {
        if (sound4.components.sound) {
          sound4.components.sound.stopSound();
        }
      });
    }
  });
  </script>


  <!-- Ask for camera permission -->
  <body>
    <div class="hint">Allow camera access and show any of your pattern markers</div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      renderer="physicallyCorrectLights: true; toneMapping: ACESFilmicToneMapping; antialias: true; logarithmicDepthBuffer: true;"
      arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false;"
    >
      <a-assets>
        <a-asset-item id="model1" src="assets/pattern-1.glb"></a-asset-item>
        <a-asset-item id="model2" src="assets/pattern-2.glb"></a-asset-item>
        <a-asset-item id="model3" src="assets/pattern-3.glb"></a-asset-item>
        <a-asset-item id="model4" src="assets/pattern-4.glb"></a-asset-item>
      </a-assets>

      <!-- Global lights (affect all markers/models) -->
      <a-entity light="type: ambient; intensity: 1.0"></a-entity>
      <a-entity light="type: hemisphere; intensity: 1.0; groundColor: #444"></a-entity>
      <a-entity light="type: directional; intensity: 1.2" position="1 2 0"></a-entity>

      <!-- Marker 1 -->
      <a-marker type="pattern" url="assets/pattern-1.patt">
        <a-entity gltf-model="#model1" material-fixes position="0 0.01 0" rotation="90 270 90" scale="1 1 1"></a-entity>
      </a-marker>
        <a-entity
        id="sound1"
        sound="src: assets/audio1.mp3; autoplay: false; loop: false">
      </a-entity>

      <!-- Marker 2 -->
      <a-marker type="pattern" url="assets/pattern-2.patt">
        <a-entity gltf-model="#model2" material-fixes position="0 0.01 0" rotation="270 180 180" scale="0.2 0.2 0.2"></a-entity>
      </a-marker>
        <a-entity
        id="sound2"
        sound="src: assets/audio2.mp3; autoplay: false; loop: false">
      </a-entity>

      <!-- Marker 3 -->
      <a-marker type="pattern" url="assets/pattern-3.patt">
        <a-entity gltf-model="#model3" material-fixes position="0 0.01 0" rotation="270 180 180" scale="0.01 0.01 0.01"></a-entity>
      </a-marker>
        <a-entity
        id="sound3"
        sound="src: assets/audio3.mp3; autoplay: false; loop: false">
      </a-entity>

      <!-- Marker 4 -->
      <a-marker type="pattern" url="assets/pattern-4.patt">
        <a-entity gltf-model="#model4" material-fixes position="0 0.01 0" rotation="270 -90 90" scale="0.2 0.2 0.2"></a-entity>
      </a-marker>
        <a-entity
        id="sound4"
        sound="src: assets/audio4.mp3; autoplay: false; loop: false">
      </a-entity>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
